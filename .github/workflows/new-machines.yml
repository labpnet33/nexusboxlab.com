name: Independent machine regression tests

on:
  push:
    branches:
      - remove-auth-guest-mode
  pull_request:
    paths:
      - 'new-machines-*.js'
      - 'independent-machines*'
      - 'creator-machines-cta.js'
      - 'vercel.json'
      - 'tests/new-machines.test.cjs'

permissions:
  contents: read

jobs:
  test:
    name: Physics and MP4 structure
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run dependency-free tests
        run: node --test tests/new-machines.test.cjs
